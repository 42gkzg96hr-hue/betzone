name: BZ - retirer Telegram
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = ecrire et commiter / false = rapport seul"
        required: true
        default: "false"
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reboucher les trous
        run: |
          cat > /tmp/bz2.py <<'PYEOF'
          import os, re, sys

          APPLY = (len(sys.argv) > 1 and sys.argv[1].strip().lower() == 'true')

          ANS = {
            'fr': "Inscris-toi sur 1win avec le code Saphir1 et fais ton dépôt : tu débloques les analyses complètes. Le bilan public reste consultable sur le site.",
            'en': "Sign up on 1win with code Saphir1 and make your deposit to unlock the full AI analyses. The public track record stays on the site.",
            'es': "Regístrate en 1win con el código Saphir1 y haz tu depósito para desbloquear los análisis completos. El historial público sigue en el sitio.",
            'pt': "Cadastre-se na 1win com o código Saphir1 e faça seu depósito para desbloquear as análises completas. O histórico público continua no site.",
            'hi': "प्रोमो कोड Saphir1 है। रजिस्ट्रेशन के समय इसे डालें और डिपॉज़िट करें — वेलकम बोनस और पूरा AI विश्लेषण अनलॉक हो जाएगा।",
            'tr': "Saphir1 koduyla 1win'e kaydol ve yatırımını yap: tüm yapay zekâ analizleri açılır. Herkese açık performans kaydı sitede kalır.",
            'ja': "プロモコードSaphir1で1winに登録し入金すると、AI分析のすべてが解放されます。公開実績はサイト上で確認できます。",
            'zh': "使用促销码 Saphir1 在 1win 注册并存款，即可解锁全部 AI 分析。公开战绩始终保留在本站。",
            'th': "สมัคร 1win ด้วยโค้ด Saphir1 แล้วฝากเงิน เพื่อปลดล็อกบทวิเคราะห์ AI ทั้งหมด สถิติสาธารณะยังอยู่บนเว็บไซต์",
            'vi': "Đăng ký 1win với mã Saphir1 và nạp tiền để mở khóa toàn bộ phân tích AI. Thành tích công khai vẫn nằm trên trang web.",
            'ms': "Daftar di 1win dengan kod Saphir1 dan buat deposit untuk membuka semua analisis AI. Rekod awam kekal di laman web.",
            'no': "Registrer deg på 1win med koden Saphir1 og sett inn penger for å låse opp alle AI-analysene. De offentlige resultatene ligger fortsatt på nettstedet.",
            'sv': "Registrera dig på 1win med koden Saphir1 och gör din insättning för att låsa upp alla AI-analyser. De offentliga resultaten finns kvar på webbplatsen.",
          }

          STEP = {
            'fr': "Débloque les analyses complètes avec ton compte 1win, et suis le bilan public sur le site.",
            'en': "Unlock the full analyses with your 1win account, and follow the public track record on the site.",
            'es': "Desbloquea los análisis completos con tu cuenta 1win y sigue el historial público en el sitio.",
            'pt': "Desbloqueie as análises completas com sua conta 1win e acompanhe o histórico público no site.",
            'hi': "अपने 1win अकाउंट से पूरा विश्लेषण अनलॉक करें और साइट पर सार्वजनिक रिकॉर्ड देखें।",
            'tr': "1win hesabınla tüm analizleri aç ve herkese açık performans kaydını sitede takip et.",
          }

          SITEWEB = "Non. Une audience suffit : compte X, page Facebook, groupe, chaîne vidéo ou site. Ce qui compte, c'est de publier honnêtement et de respecter le 18+."
          PROMO = "Partage ton lien là où tu es déjà suivi : X, Facebook, WhatsApp, YouTube ou ton propre site. Sois honnête sur les risques et respecte le 18+."

          FAQ = re.compile(r'(<div class="faq"[^>]*>)((?:(?!<div|</div>).)*?)(</div>)', re.S)
          STP = re.compile(r'(<div class="card step"[^>]*>)((?:(?!<div|</div>).)*?)(</div>)', re.S)

          nf = ns = 0
          files = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github')]
              for nm in names:
                  if nm.lower().endswith('.html'):
                      files.append(os.path.join(root, nm))
          files.sort()

          for p in files:
              try:
                  src = open(p, encoding='utf-8').read()
              except Exception:
                  continue
              lm = re.search(r'<html[^>]*lang="([^"]+)"', src)
              lang = (lm.group(1) if lm else 'fr').split('-')[0].lower()
              s = src

              def faq_fix(m):
                  global nf
                  head, inner, tail = m.group(1), m.group(2), m.group(3)
                  if re.search(r'<p[\s>]', inner):
                      return m.group(0)
                  q = re.sub(r'<[^>]*>', '', inner)
                  if 'site web' in q:
                      txt = SITEWEB
                  else:
                      txt = ANS.get(lang, ANS['en'])
                  nf += 1
                  return head + inner + '<p>' + txt + '</p>' + tail

              def step_fix(m):
                  global ns
                  head, inner, tail = m.group(1), m.group(2), m.group(3)
                  if re.search(r'<p[\s>]', inner):
                      return m.group(0)
                  h = re.sub(r'<[^>]*>', '', inner)
                  if 'Fais la promo' in h:
                      txt = PROMO
                  else:
                      txt = STEP.get(lang, STEP['en'])
                  ns += 1
                  return head + inner + '<p>' + txt + '</p>' + tail

              s = FAQ.sub(faq_fix, s)
              s = STP.sub(step_fix, s)

              if s != src and APPLY:
                  open(p, 'w', encoding='utf-8').write(s)

          print('=== BZ RAPPORT 2 ===')
          print('mode  :', 'ECRITURE' if APPLY else 'SIMULATION')
          print('faq rebouchees  :', nf)
          print('etapes rebouchees:', ns)
          PYEOF
          python3 /tmp/bz2.py "${{ github.event.inputs.apply }}"
      - name: Commit
        if: github.event.inputs.apply == 'true'
        run: |
          git config user.name "bz-bot"
          git config user.email "bz-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Reboucher les blocs vides laisses par le retrait de Telegram"
          git push
