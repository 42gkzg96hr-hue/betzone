on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = ecrire et commiter / false = rapport seul"
        required: true
        default: "false"
permissions:
  contents: write
jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Nettoyage
        run: |
          cat > /tmp/bz.py <<'PYEOF'
          import os, re, sys

          APPLY = (len(sys.argv) > 1 and sys.argv[1].strip().lower() == 'true')
          EXT = ('.html', '.htm', '.xml', '.json', '.txt', '.md')
          SKIP_DIRS = ('.git', '.github')

          TGA = r'<a\b[^>]*?t\.me[^>]*?>.*?</a>'
          HAS = re.compile(r't\.me|[Tt]elegram|TELEGRAM')

          stats = {}
          def bump(k, n=1):
              if n:
                  stats[k] = stats.get(k, 0) + n

          HAND = [
            (r'Rejoins gratuitement notre ' + TGA + r' pour le prono du jour, et inscris-toi',
             'Inscris-toi'),
            (r'Rejoins notre Telegram gratuit pour le prono du jour et le bilan transparent, gagné comme perdu\.',
             "Débloque le robot d'analyse IA avec ton ID joueur 1win, et suis le bilan public sur le site."),
            (r'Rejoins notre Telegram gratuit pour le prono du jour et le bilan transparent\.',
             "Débloque le robot d'analyse IA avec ton ID joueur 1win, et suis le bilan public sur le site."),
            (r'Pronos complets \+ bilan sur le Telegram', 'Analyses complètes et bilan public'),
            (r'Pronos complets \+ bilan sur Telegram', 'Analyses complètes et bilan public'),
            (r'Join our free Telegram[^<.]*\.',
             'Unlock the AI analysis robot with your 1win player ID, and follow the public track record on the site.'),
            (r'and get our detailed AI-assisted analyses plus a track record on Telegram',
             'and get our detailed AI-assisted analyses plus the public track record'),
          ]

          def drop_blocks(s, tag, need_class=None, skip_class=None):
              n = 0
              pat = re.compile(
                  r'<' + tag + r'\b([^>]*)>((?:(?!<' + tag + r'\b|</' + tag + r'>).)*?)</' + tag + r'>',
                  re.S)
              while True:
                  hit = None
                  for m in pat.finditer(s):
                      attrs, inner = m.group(1), m.group(2)
                      if not HAS.search(inner):
                          continue
                      cm = re.search(r'class\s*=\s*"([^"]*)"', attrs)
                      cls = cm.group(1) if cm else ''
                      if need_class and need_class not in cls:
                          continue
                      if skip_class and skip_class in cls:
                          continue
                      hit = m
                      break
                  if not hit:
                      break
                  s = s[:hit.start()] + s[hit.end():]
                  n += 1
              return s, n

          SENT_START = '>.!?—–'
          SENT_END = '.!?'
          TRAIL = re.compile(r'[ \t]*[—–\-:,;]+[ \t]*$')

          def kill_sentence(s, a, b):
              i = a - 1
              while i >= 0 and s[i] not in SENT_START and s[i] != '<':
                  i -= 1
              left = i + 1
              j = b
              while j < len(s) and s[j] not in SENT_END and s[j] != '<':
                  j += 1
              if j < len(s) and s[j] in SENT_END:
                  j += 1
              head = TRAIL.sub('', s[:left])
              return head + s[j:]

          ANCHOR = re.compile(r'<a\b[^>]*>.*?</a>', re.S)

          def is_tg(open_tag):
              m = re.search(r'href\s*=\s*"([^"]*)"', open_tag)
              if not m:
                  return False
              h = m.group(1).strip().lower()
              return ('t.me' in h) or h == '#telegram'

          def is_btn(open_tag):
              m = re.search(r'class\s*=\s*"([^"]*)"', open_tag)
              return bool(m) and 'btn' in m.group(1)

          def pass_anchors(s):
              nb = np = 0
              for _ in range(60):
                  found = None
                  for m in ANCHOR.finditer(s):
                      t = m.group(0)
                      ot = t[:t.find('>') + 1]
                      if is_tg(ot):
                          found = (m, is_btn(ot))
                          break
                  if not found:
                      break
                  m, btn = found
                  if btn:
                      s = s[:m.start()] + s[m.end():]
                      nb += 1
                  else:
                      s = kill_sentence(s, m.start(), m.end())
                      np += 1
              return s, nb, np

          LDJ = re.compile(r'(<script type="application/ld\+json">)(.*?)(</script>)', re.S)

          def clean_ld(s):
              n = [0]
              def one(m):
                  body = m.group(2)
                  def fix(sm):
                      v = sm.group(1)
                      if 'elegram' not in v and 't.me' not in v:
                          return sm.group(0)
                      n[0] += 1
                      parts = re.split(r'(?<=[.!?]) ', v)
                      parts = [p for p in parts if 'elegram' not in p and 't.me' not in p]
                      nv = ' '.join(parts).strip()
                      if not nv:
                          nv = "Inscris-toi sur 1win avec le code Saphir1 et fais ton depot."
                      return '"' + nv + '"'
                  return m.group(1) + re.sub(r'"((?:[^"\\]|\\.)*)"', fix, body) + m.group(3)
              return LDJ.sub(one, s), n[0]

          EMPTY = [
              (re.compile(r'<p\b[^>]*>\s*</p>'), ''),
              (re.compile(r'<li\b[^>]*>\s*</li>'), ''),
              (re.compile(r'<span\b[^>]*>\s*</span>'), ''),
          ]

          files = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in SKIP_DIRS]
              for nm in names:
                  if nm.lower().endswith(EXT):
                      files.append(os.path.join(root, nm))
          files.sort()

          touched = 0
          residual = []
          for p in files:
              try:
                  src = open(p, encoding='utf-8').read()
              except Exception:
                  continue
              if not HAS.search(src):
                  continue
              s = src

              s, k = re.subn(r',\s*TG\s*=\s*"t\.me"', '', s); bump('tracking-var', k)
              s, k = re.subn(r'\n[^\n]*indexOf\(TG\)[^\n]*', '', s); bump('tracking-branche', k)

              for pat, rep in HAND:
                  s, k = re.subn(pat, rep, s, flags=re.S); bump('main', k)

              s, k = re.subn(r'\s*(?:<!--[^>]*?-->\s*)?<section id="telegram">.*?</section>', '', s, flags=re.S)
              bump('section', k)

              s, k = drop_blocks(s, 'span'); bump('span', k)
              s, k = drop_blocks(s, 'li'); bump('li', k)
              s, k = drop_blocks(s, 'div', need_class='card', skip_class='step'); bump('carte', k)

              s, nb, npz = pass_anchors(s); bump('bouton', nb); bump('phrase', npz)

              s, k = drop_blocks(s, 'p'); bump('p', k)

              s, k = clean_ld(s); bump('jsonld', k)

              for rx, rep in EMPTY:
                  s = rx.sub(rep, s)

              if HAS.search(s):
                  for line in s.split('\n'):
                      if HAS.search(line):
                          txt = re.sub(r'<[^>]*>', ' ', line)
                          txt = re.sub(r'https?:[^\s"\'<>]*', ' ', txt)
                          txt = re.sub(r'\s+', ' ', txt).strip()
                          residual.append(p + ' :: ' + txt[:110])

              if s != src:
                  touched += 1
                  if APPLY:
                      open(p, 'w', encoding='utf-8').write(s)

          print('=== BZ RAPPORT ===')
          print('mode        :', 'ECRITURE' if APPLY else 'SIMULATION')
          print('fichiers    :', len(files))
          print('modifies    :', touched)
          for k in sorted(stats):
              print('  %-18s %d' % (k, stats[k]))
          print('restes      :', len(residual))
          for r in residual[:60]:
              print('  !', r)
          PYEOF
          python3 /tmp/bz.py "${{ github.event.inputs.apply }}"
      - name: Commit
        if: github.event.inputs.apply == 'true'
        run: |
          git config user.name "bz-bot"
          git config user.email "bz-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Retrait du canal Telegram : liens, boutons et mentions supprimes"
          git push
