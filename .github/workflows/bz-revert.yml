name: BZ - retirer le bloc langues ajoute
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = ecrire et commiter / false = rapport seul"
        required: true
        default: "false"
permissions:
  contents: write
jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrait
        run: |
          cat > /tmp/bz.py <<'PYEOF'
          import os, re, sys

          APPLY = (len(sys.argv) > 1 and sys.argv[1].strip().lower() == 'true')
          PAT = re.compile(r'<p class="links" id="bz-langs">.*?</p>', re.S)

          touched = []
          reste = []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in ('.git', '.github')]
              for nm in names:
                  if not nm.endswith('.html'):
                      continue
                  p = os.path.join(root, nm)[2:]
                  s = open(p, encoding='utf-8').read()
                  if 'bz-langs' not in s:
                      continue
                  s2 = PAT.sub('', s)
                  if 'bz-langs' in s2:
                      reste.append(p)
                  if s2 != s:
                      touched.append(p)
                      if APPLY:
                          open(p, 'w', encoding='utf-8').write(s2)

          print('=== BZ RETRAIT ===')
          print('mode     :', 'ECRITURE' if APPLY else 'SIMULATION')
          print('fichiers :', len(touched))
          for t in touched:
              print('  -', t)
          print('restes   :', len(reste))
          for r in reste:
              print('  !', r)
          PYEOF
          python3 /tmp/bz.py "${{ github.event.inputs.apply }}"
      - name: Commit
        if: github.event.inputs.apply == 'true'
        run: |
          git config user.name "bz-bot"
          git config user.email "bz-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Retrait du bloc langues ajoute par erreur"
          git push
