<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>Redirection… | BetZone</title>
<link rel="canonical" href="https://betzonebet.com/">
<script>
(function(){
  var p = window.location.pathname || "/";
  // Anciennes URLs GitHub Pages : /betzone/xxx -> /xxx
  if (p.indexOf("/betzone/") === 0) {
    var dest = p.replace("/betzone/", "/");
    window.location.replace("https://betzonebet.com" + dest + window.location.search + window.location.hash);
    return;
  }
  if (p === "/betzone" || p === "/betzone/") {
    window.location.replace("https://betzonebet.com/");
    return;
  }
  // Toute autre URL inconnue -> accueil après un court instant
  setTimeout(function(){ window.location.replace("https://betzonebet.com/"); }, 1500);
})();
</script>
<style>
body{background:#0a0f28;color:#eef0f7;font-family:'Segoe UI',system-ui,-apple-system,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;text-align:center}
.box{max-width:520px;padding:30px}
h1{color:#deb23e;font-size:1.6rem;margin-bottom:10px}
a{color:#deb23e;font-weight:700}
p{color:#9aa3c0}

/* bz-uifix-nav-btn */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;vertical-align:middle;line-height:1.2;box-sizing:border-box;text-align:center}
.btn.o{padding:11px 24px;margin-left:0}
.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
.cta-row .btn{margin:0}
.cta .btn{margin:5px 6px}
.nav a.item{white-space:nowrap}
</style>
</head>
<body>
<div class="box">
<h1>Page introuvable</h1>
<p>On te redirige vers BetZone… Si rien ne se passe, <a href="https://betzonebet.com/">clique ici pour revenir à l'accueil</a>.</p>
<p style="font-size:.85rem;margin-top:20px">🔞 18+ · Jouez responsable.</p>
</div>
<!--bz-afftrack-v1-->
<script>
(function(){
  var AFF="lkgp.pro", TG="t.me";
  function slug(){var p=location.pathname.replace(/^\//,'')||'home';return p.replace(/\.html$/,'')||'home';}
  function send(kind,dest){
    var page=slug(), label=kind+'/'+page;
    // GoatCounter
    try{ if(window.goatcounter&&goatcounter.count){ goatcounter.count({path:'click-'+label,title:'CLICK '+kind+' — '+page,event:true}); } }catch(e){}
    // Microsoft Clarity : tag + event
    try{ if(window.clarity){ clarity('set','aff_click',label); clarity('event','click_'+kind); } }catch(e){}
    // Google Analytics 4 (si présent un jour)
    try{ if(window.gtag){ gtag('event','affiliate_click',{link_type:kind,page_slug:page,destination:dest}); } }catch(e){}
    // mémo local : compteur par page (visible en console via bzStats())
    try{ var k='bz_clicks', d=JSON.parse(localStorage.getItem(k)||'{}'); d[label]=(d[label]||0)+1; localStorage.setItem(k,JSON.stringify(d)); }catch(e){}
  }
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a'):null;
    if(!a||!a.href) return;
    if(a.href.indexOf(AFF)>-1) send('affiliate',a.href);
    else if(a.href.indexOf(TG)>-1) send('telegram',a.href);
  },true);
  window.bzStats=function(){try{return JSON.parse(localStorage.getItem('bz_clicks')||'{}')}catch(e){return{}}};
})();
</script>
</body>
</html>
